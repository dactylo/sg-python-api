# ==========================================================
# Build System
# ==========================================================
[build-system]
build-backend = "hatchling.build"
requires = [ "editables~=0.3", "hatch-fancy-pypi-readme>=25.1", "hatchling>=1.27" ]

# ==========================================================
# Project Metadata
# ==========================================================
[project]
name = "sg-python-api"
version = "0.1.0"
description = "Python client for Autodesk Flow Production Tracking"
keywords = [ "api", "flow-production-tracking", "shotgrid", "shotgun", "shotgun-api3" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dynamic = [ "readme" ]
dependencies = [
  "urllib3>=2,<3",
]
optional-dependencies.async = [
  "httpx2>=2,<3",
]
urls.Documentation = "https://github.com/dactylo/sg-python-api/tree/main/docs"
urls.Homepage = "https://github.com/dactylo/sg-python-api"
urls.Issues = "https://github.com/dactylo/sg-python-api/issues"
urls.Repository = "https://github.com/dactylo/sg-python-api"

[dependency-groups]
dev = [
  "installer",
  "mdformat",
  "mdformat-config",
  "mdformat-frontmatter",
  "mdformat-gfm",
  "mdformat-pyproject",
  "mdformat-ruff",
  "mdformat-shfmt",
  "pyproject-fmt",
  "pyright",
  "ruff",
  { include-group = "test" },
]
test = [
  "anyio",
  "mdformat",
  "mdformat-gfm",
  "pyright",
  "pytest",
  "pytest-xdist>=3.2",
]

[tool.hatch]
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.targets.wheel.packages = [ "src/shotgun_api3" ]
build.targets.sdist.include = [
  "/README.md",
  "/COMPATIBILITY.md",
  "/docs/*.md",
  "/examples/**",
  "/Makefile",
  "/scripts/**",
  "/src/**",
  "/tests/**",
]

# Keep checkout links relative; package links target this release.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]\n]*\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://raw.githubusercontent.com/dactylo/sg-python-api/v$HFPR_VERSION/\2\3'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)(\[[^\]\n]+\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://github.com/dactylo/sg-python-api/blob/v$HFPR_VERSION/\2\3'

[tool.uv]
# CI supplies the native Taplo CLI; its Python package lacks Linux/Windows ARM wheels.
exclude-dependencies = [
  { package = { name = "mdformat-config", version = "0.2.1" }, dependencies = [ "taplo" ] },
]

# ==========================================================
# Ruff Configuration
# ==========================================================
[tool.ruff]
target-version = "py311"
line-length = 99
format.quote-style = "single"
format.exclude = [ "*.md" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Conflicts with the Ruff formatter
  "CPY001", # Copyright notices are not required
  "EM101",  # Exception must not use string literal
  "EM102",  # Exception must not use f-string literal
  "FBT001", # Boolean positional arg in function definition
  "FBT002", # Boolean default value in function definition
  "Q000",   # Conflicts with the Ruff formatter
  "Q003",   # Conflicts with the Ruff formatter
  "TRY003", # Avoid specifying long messages outside exception class
]
# Command-line scripts and examples intentionally print output.
lint.per-file-ignores."examples/**/*.py" = [ "T201" ]
lint.per-file-ignores."scripts/**/*.py" = [ "T201" ]
# Repeated same-file collaboration follows module-boundary privacy.
lint.per-file-ignores."scripts/benchmark.py" = [ "SLF001" ]
lint.per-file-ignores."src/shotgun_api3/_async_client.py" = [ "SLF001" ]
lint.per-file-ignores."src/shotgun_api3/_config.py" = [ "SLF001" ]
lint.per-file-ignores."src/shotgun_api3/_transport.py" = [ "SLF001" ]
lint.per-file-ignores."tests/**/*.py" = [
  "D",       # No docstrings required in tests
  "PLR2004", # Allow magic values in tests
  "S101",    # Allow asserts in tests
  "S603",    # Allow subprocess calls in tests
  "S607",    # Allow partial executable paths in tests
  "SLF001",  # Tests intentionally inspect and patch private state
]
lint.pydocstyle.convention = "google"

[tool.pyproject-fmt]
max_supported_python = "3.15"

# ==========================================================
# Pyright Configuration
# ==========================================================
[tool.pyright]
pythonVersion = "3.11"  # Keep in sync with tool.ruff.target-version
typeCheckingMode = "strict"
extraPaths = [ ".", "src" ]
executionEnvironments = [
  { root = "tests", reportPrivateUsage = "none" },
  { root = "." },
]

# ==========================================================
# Pytest Configuration
# ==========================================================
[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = [ "-q", "--strict-markers", "--tb=short" ]
ini_options.markers = [
  "async_required: tests required when the async extra is installed",
  "live: tests requiring a live test site (set SG_TEST_* env vars)",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
ini_options.faulthandler_timeout = 300

# ==========================================================
# Mdformat Configuration (Requires mdformat-pyproject)
# ==========================================================
[tool.mdformat]
wrap = 99  # Keep in sync with tool.ruff.line-length
number = true
